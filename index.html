<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Live Cricket Score</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background:
    linear-gradient(rgba(3,4,94,0.6), rgba(2,62,138,0.6)),
    url("img3.jpg");
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  color: #fff;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

.card {
  background: rgba(255, 255, 255, 0.08);
  backdrop-filter: blur(10px);
  border-radius: 16px;
  padding: 25px;
  width: 380px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.4);
}

h1 {
  text-align: center;
  font-size: 20px;
  color: #90e0ef;
}

.score {
  font-size: 40px;
  font-weight: bold;
  text-align: center;
}

.overs {
  text-align: center;
  color: #ade8f4;
}

.players {
  margin-top: 15px;
  background: rgba(255,255,255,0.05);
  padding: 12px;
  border-radius: 10px;
}

.player {
  display: flex;
  justify-content: space-between;
  margin: 6px 0;
}

.arrow {
  color: #38b000;
  margin-right: 6px;
}

.balls {
  display: flex;
  justify-content: space-between;
  margin-top: 18px;
}

.ball {
  width: 45px;
  height: 45px;
  border-radius: 50%;
  background: #0077b6;
  display: flex;
  justify-content: center;
  align-items: center;
  font-weight: bold;
}

.ball.six { background: #38b000; }
.ball.four { background: #ffb703; color: #000; }
.ball.wicket { background: #d00000; }

.extras {
  display: flex;
  justify-content: space-around;
  margin-top: 12px;
  font-size: 14px;
  color: #ffd166;
}

.status {
  text-align: center;
  margin-top: 10px;
  color: #48cae4;
  font-size: 14px;
}

.bowler {
  text-align: center;
  margin-top: 6px;
  font-size: 15px;
  color: #ffd166;
}

.welcome {
  position: absolute;
  top: 25px;
  width: 100%;
  text-align: center;
  font-size: 34px;
  font-weight: bold;
  letter-spacing: 2px;
  color: #caf0f8;
  text-shadow: 0 4px 10px rgba(0,0,0,0.6);
}
</style>
</head>

<body>

<div class="welcome">WELCOME TO GP KISHANGANJ</div>

<div class="card">
  <h1 id="teams">Team A vs Team B</h1>

  <div class="score" id="score">0 / 0</div>
  <div class="overs" id="overs">Overs: 0.0</div>

  <div class="players">
    <div class="player">
      <div>
        <span id="strikerArrow" class="arrow">▶</span>
        <span id="striker">Striker</span>
      </div>
      <div>
        <span id="strikerRuns">0</span> (<span id="strikerBalls">0</span>)
      </div>
    </div>

    <div class="player">
      <div>
        <span id="nonStrikerArrow" class="arrow" style="visibility:hidden;">▶</span>
        <span id="nonStriker">Non-Striker</span>
      </div>
      <div>
        <span id="nonStrikerRuns">0</span> (<span id="nonStrikerBalls">0</span>)
      </div>
    </div>

    <div class="player">
      <div>Run Rate</div>
      <div id="strikeRate">0.00</div>
    </div>
  </div>

  <div class="bowler" id="bowler">Bowler: -</div>
  <div class="bowler" id="bowlerRuns">Runs Conceded: 0</div>
  <div class="bowler" id="bowlerWickets">Wickets Taken: 0</div>

  <div class="balls" id="balls"></div>

  <div class="extras">
    <div>Wide: <span id="wide">0</span></div>
    <div>No-Ball: <span id="noBall">0</span></div>
  </div>

  <div class="status" id="status">Waiting for update...</div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<script>
var firebaseConfig = {
  apiKey: "AIzaSyANc7oEJrzQrIN9lCaitcoUKL9Ftqg6L-w",
  authDomain: "umang2026-440bc.firebaseapp.com",
  databaseURL: "https://umang2026-440bc-default-rtdb.firebaseio.com",
  projectId: "umang2026-440bc",
  storageBucket: "umang2026-440bc.appspot.com",
  messagingSenderId: "6507613214",
  appId: "1:6507613214:web:f4731ebf83cecb261466f"
};

firebase.initializeApp(firebaseConfig);

firebase.database().ref("match").on("value", function(snapshot) {
  var d = snapshot.val();
  if (!d) return;

  document.getElementById("teams").innerText = d.teamA + " vs " + d.teamB;
  document.getElementById("score").innerText = d.runs + " / " + d.wickets;
  document.getElementById("overs").innerText = "Overs: " + d.overs;
  document.getElementById("status").innerText = d.status;

  document.getElementById("striker").innerText = d.striker;
  document.getElementById("nonStriker").innerText = d.nonStriker;

  document.getElementById("strikerRuns").innerText = d.strikerRuns || 0;
  document.getElementById("strikerBalls").innerText = d.strikerBalls || 0;
  document.getElementById("nonStrikerRuns").innerText = d.nonStrikerRuns || 0;
  document.getElementById("nonStrikerBalls").innerText = d.nonStrikerBalls || 0;

  document.getElementById("bowler").innerText = "Bowler: " + d.bowler;
  document.getElementById("bowlerRuns").innerText = "Runs Conceded: " + (d.bowlerRuns || 0);
  document.getElementById("bowlerWickets").innerText = "Wickets Taken: " + (d.bowlerWickets || 0);

  document.getElementById("strikeRate").innerText =
    d.strikeRate ? d.strikeRate.toFixed(2) : "0.00";

  document.getElementById("wide").innerText = d.wide || 0;
  document.getElementById("noBall").innerText = d.noBall || 0;

  var ballsDiv = document.getElementById("balls");
  ballsDiv.innerHTML = "";
  var lastBall = null;

  if (d.balls) {
    Object.values(d.balls).forEach(ball => {
      lastBall = ball;
      var div = document.createElement("div");
      div.className = "ball";
      div.innerText = ball;

      if (ball == 6) div.classList.add("six");
      else if (ball == 4) div.classList.add("four");
      else if (ball == "W") div.classList.add("wicket");

      ballsDiv.appendChild(div);
    });
  }

  document.getElementById("strikerArrow").style.visibility = "visible";
  document.getElementById("nonStrikerArrow").style.visibility = "hidden";

  if (lastBall !== null && lastBall !== "W" && lastBall % 2 === 1) {
    document.getElementById("strikerArrow").style.visibility = "hidden";
    document.getElementById("nonStrikerArrow").style.visibility = "visible";
  }
});
</script>

</body>
</html>
