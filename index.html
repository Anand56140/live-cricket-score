<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Cricket Score</title>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    body {
      font-family: Arial;
      background: #0b132b;
      color: white;
      text-align: center;
      padding: 30px;
    }
    .box {
      background: #1c2541;
      padding: 20px;
      border-radius: 10px;
      max-width: 400px;
      margin: auto;
    }
    h1 { color: #5bc0be; }
    .score { font-size: 32px; margin: 15px 0; }
    .overs, .status { font-size: 18px; margin: 5px 0; }
  </style>
</head>
<body>

  <div class="box">
    <h1>🏏 Live Cricket Score</h1>
    <p id="teams">Loading...</p>
    <div class="score" id="score">--/--</div>
    <p class="overs" id="overs">Overs: --</p>
    <p class="status" id="status">Status: --</p>
  </div>

  <script>
    // 🔴 Replace with your Firebase project config
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT.firebaseapp.com",
      databaseURL: "https://YOUR_PROJECT-default-rtdb.firebaseio.com",
      projectId: "YOUR_PROJECT",
      storageBucket: "YOUR_PROJECT.appspot.com",
      messagingSenderId: "XXXXXX",
      appId: "XXXXXX"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const matchRef = db.ref("match");

    matchRef.on("value", (snapshot) => {
      const data = snapshot.val();
      if (!data) return;

      document.getElementById("teams").innerText = data.teamA + " vs " + data.teamB;
      document.getElementById("score").innerText = data.runs + "/" + data.wickets;
      document.getElementById("overs").innerText = "Overs: " + data.overs;
      document.getElementById("status").innerText = "Status: " + data.status;
    });
  </script>
</body>
</html>
